# Vids (Máquina de Criativos) no painel, 2026-11-20.
# Incluído no server do painel.kazakora.com (sites-available/painel), como
# snippets/painel-vids.conf. O painel da máquina roda no serviço systemd "vids"
# (usuário munck, 127.0.0.1:4848). Cada pedido passa antes pelo login
# do admin: /admin/vids/acesso responde 204 (libera) ou 401/403 (barra).

location = /vids {
    return 302 /vids/;
}

location ^~ /vids/ {
    auth_request /_vids_acesso;
    error_page 401 = @vids_entrar;

    proxy_pass http://127.0.0.1:4848/;
    proxy_http_version 1.1;
    # O painel só atende Host localhost:4848 (barra DNS rebinding); a origem
    # pública é liberada por MUNCK_ORIGENS no serviço.
    proxy_set_header Host localhost:4848;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Connection "";
    # /api/eventos é SSE e o Claude pode trabalhar por vários minutos.
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
    client_max_body_size 64M;
}

# Arquivos gerados pelos projetos (vídeo, capa, folha): servidos em sandbox,
# para um HTML gerado pela máquina não rodar script na origem do painel.
location ^~ /vids/arq/ {
    auth_request /_vids_acesso;
    error_page 401 = @vids_entrar;
    proxy_pass http://127.0.0.1:4848/arq/;
    proxy_http_version 1.1;
    proxy_set_header Host localhost:4848;
    proxy_set_header Connection "";
    proxy_buffering off;
    add_header Content-Security-Policy "sandbox" always;
    add_header X-Content-Type-Options "nosniff" always;
}

location = /_vids_acesso {
    internal;
    include fastcgi_params;
    fastcgi_pass unix:/run/php/php-painel.sock;
    fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
    fastcgi_param SCRIPT_NAME /index.php;
    fastcgi_param REQUEST_URI /admin/vids/acesso;
    fastcgi_param DOCUMENT_URI /index.php;
    fastcgi_param QUERY_STRING "";
    fastcgi_param REQUEST_METHOD GET;
    fastcgi_param CONTENT_LENGTH "";
    fastcgi_param CONTENT_TYPE "";
    fastcgi_param HTTP_ACCEPT application/json;
    fastcgi_param HTTP_X_REQUESTED_WITH XMLHttpRequest;
    fastcgi_pass_request_body off;
}

location @vids_entrar {
    return 302 /entrar;
}
