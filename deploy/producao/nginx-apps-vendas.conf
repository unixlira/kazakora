# Apps de vendas como sites próprios (2026-11-19): app.kazakora.com e
# app.ferrakora.com. Só arquivos estáticos dos repositórios
# unixlira/kazakora-vendas-app e unixlira/ferrakora-vendas-app (./publicar.sh
# de cada um, rsync para /var/www/apps-vendas/<loja>/). Os dados vêm da API
# https://painel.kazakora.com/api-apps-vendas/<loja>/ (token + CORS).
# Na VPS: /etc/nginx/sites-enabled/apps-vendas, com os snippets
# apps-vendas-site.conf e apps-vendas-cabecalhos.conf. O HTTPS (443) é do
# certbot --nginx, rodado quando o DNS resolver (/root/apps-vendas-certbot.sh).
server {
    listen 80;
    listen [::]:80;
    server_name app.kazakora.com;
    root /var/www/apps-vendas/kazakora;
    include snippets/apps-vendas-site.conf;
}

server {
    listen 80;
    listen [::]:80;
    server_name app.ferrakora.com;
    root /var/www/apps-vendas/ferrakora;
    include snippets/apps-vendas-site.conf;
}
