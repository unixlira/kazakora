; Pool do PHP-FPM só da loja KazaKora.
[kazakora]
user = deploy
group = www-data
listen = /run/php/kazakora.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

; ~60 MB por processo: até 40 = ~2,4 GB no pico.
pm = dynamic
pm.max_children = 40
pm.start_servers = 8
pm.min_spare_servers = 4
pm.max_spare_servers = 12
pm.max_requests = 1000

request_terminate_timeout = 120s
php_admin_value[error_log] = /var/www/kazakora/shared/storage/logs/php-fpm.log
php_admin_flag[log_errors] = on
