# Substitui snippets/painel-apps-vendas.conf depois que app.kazakora.com e
# app.ferrakora.com estiverem no ar com HTTPS (2026-11-19): o endereço
# antigo dentro do painel manda para o site próprio de cada app.
location ^~ /app/kazakora/ {
    return 301 https://app.kazakora.com/;
}
location ^~ /app/ferrakora/ {
    return 301 https://app.ferrakora.com/;
}
