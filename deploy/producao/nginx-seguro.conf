# Checkout seguro da KazaKora (pedido 2026-10-23): seguro.kazakora.com é o
# mesmo sistema da loja; o Laravel (RedirecionarCheckoutSeguro) só deixa
# abrir /pagamento e o que o checkout usa, o resto volta para kazakora.com.
# Vai em /etc/nginx/sites-available/seguro (link em sites-enabled) e depois:
#   certbot --nginx -d seguro.kazakora.com
# O certbot acrescenta o https (443) e o redirecionamento http -> https.
# Precisa antes do registro DNS seguro (CNAME para kazakora.com) na Cloudflare.
server {
    listen 80;
    listen [::]:80;
    server_name seguro.kazakora.com;

    root /var/www/kazakora/current/public;
    index index.php;
    charset utf-8;
    include snippets/cloudflare-realip.conf;
    client_max_body_size 64M;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    # Painel nunca pelo endereço do checkout (mesma regra do kazakora.com).
    location = /admin { return 404; }
    location ^~ /admin/ { return 404; }

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

    # Arquivos do Vite têm hash no nome: cache de 1 ano.
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    location ~* \.(?:jpg|jpeg|png|gif|webp|avif|ico|svg|woff2?|mp4)$ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
        try_files $uri /index.php?$query_string;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ \.php$ {
        # Pool por caminho (loja, ferrakora-api, integracoes): nginx-kazakora-pools.conf
        # (vai em /etc/nginx/conf.d/kazakora-pools.conf).
        limit_req zone=kz_loja burst=40 nodelay;
        limit_req zone=kz_ferrakora burst=40 nodelay;
        fastcgi_pass $kz_php_pool;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        include fastcgi_params;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_read_timeout 120s;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
