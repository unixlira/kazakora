# Apps de vendas KazaKora e FerraKora (2026-11-19), dentro do server
# painel.kazakora.com (/etc/nginx/sites-enabled/painel), antes dos outros
# location. Os arquivos vêm dos repositórios unixlira/kazakora-vendas-app e
# unixlira/ferrakora-vendas-app (./publicar.sh de cada um), fora da pasta
# do Laravel: o deploy do kazakora (rsync --delete) não apaga.
# ^~ para o regex de imagens do painel não pegar os ícones. Tudo no-cache:
# publicar vale na próxima abertura do app (são poucos KB).
location ^~ /app/kazakora/ {
    alias /var/www/apps-vendas/kazakora/;
    index index.html;
    types { application/manifest+json webmanifest; text/javascript js; text/css css; text/html html; image/png png; image/svg+xml svg; }
    add_header Cache-Control "no-cache" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
}
location ^~ /app/ferrakora/ {
    alias /var/www/apps-vendas/ferrakora/;
    index index.html;
    types { application/manifest+json webmanifest; text/javascript js; text/css css; text/html html; image/png png; image/svg+xml svg; }
    add_header Cache-Control "no-cache" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
}
