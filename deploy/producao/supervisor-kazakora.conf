; Filas da loja (Redis) pelo Horizon desde 2026-10-11. O config/horizon.php
; sobe 3 processos em "default" (e-mails, WhatsApp, etiquetas) e 1 em "nfe"
; (notas fiscais, separada para nota nunca esperar atrás de e-mail).
; Painel: Admin > Filas (Horizon), em /admin/filas.
[program:kazakora-horizon]
environment=OPENSSL_CONF="/etc/ssl/openssl-kazakora.cnf"
command=php8.3 /var/www/kazakora/current/artisan horizon
user=deploy
autostart=true
autorestart=true
stopwaitsecs=320
stdout_logfile=/var/www/kazakora/shared/storage/logs/horizon.log
stdout_logfile_maxbytes=10MB
redirect_stderr=true

[group:kazakora]
programs=kazakora-horizon
