name: Deploy (produção)

# Push no main = loja kazakora.com na VPS (pedido 2026-10-10).
# Testa, compila no GitHub, envia para uma pasta nova (releases/...), roda as
# migrations e só então troca o link "current" — o site não sai do ar. Se a
# loja não responder depois da troca, volta sozinha para a versão anterior.
# Instalação da VPS e como voltar versão na mão: deploy/producao/LEIA-ME.md.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-producao
  cancel-in-progress: false

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: gd, intl, bcmath, zip, soap, pdo_sqlite
          tools: composer:v2

      - name: Dependências
        run: composer install --no-interaction --prefer-dist --no-progress

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Front (os testes de página precisam do manifest do Vite)
        run: npm ci && npm run build

      - name: Testes
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan test --compact

  deploy:
    needs: testes
    runs-on: ubuntu-latest
    environment: producao
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2

      - name: Dependências PHP (produção)
        run: composer install --no-dev --optimize-autoloader --classmap-authoritative --no-interaction --prefer-dist --no-progress

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Front
        run: npm ci && npm run build

      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.PROD_SSH_PRIVATE_KEY }}

      - name: Servidor conhecido
        run: |
          for i in 1 2 3; do ssh-keyscan -T 15 ${{ secrets.PROD_SSH_HOST }} >> ~/.ssh/known_hosts && break; sleep 5; done

      - name: Enviar nova versão
        id: envio
        run: |
          RELEASE=$(date -u +%Y%m%d%H%M%S)-${GITHUB_SHA::7}
          echo "release=$RELEASE" >> "$GITHUB_OUTPUT"
          BASE=/var/www/kazakora
          ssh deploy@${{ secrets.PROD_SSH_HOST }} "mkdir -p $BASE/releases/$RELEASE"
          # --link-dest: o que não mudou vira hard link da versão atual (envio rápido).
          # Até 3 tentativas com keepalive: 2x em 11/10/2026 a conexão caiu
          # no meio do envio (ssh 255) e o deploy só passou no rerun.
          for tentativa in 1 2 3; do
            rsync -az --delete \
              -e "ssh -o ServerAliveInterval=15 -o ServerAliveCountMax=8 -o ConnectTimeout=20" \
              --exclude='.git' --exclude='.github' --exclude='.env' --exclude='/storage' \
              --exclude='node_modules' --exclude='tests' --exclude='/public/storage' \
              --link-dest=$BASE/current/ \
              ./ deploy@${{ secrets.PROD_SSH_HOST }}:$BASE/releases/$RELEASE/ && break
            [ "$tentativa" = 3 ] && exit 1
            echo "rsync falhou (tentativa $tentativa/3), repetindo em 10s..."
            sleep 10
          done

      - name: Ativar
        run: |
          ssh deploy@${{ secrets.PROD_SSH_HOST }} 'bash -s' <<SCRIPT
          set -euo pipefail
          BASE=/var/www/kazakora
          R=\$BASE/releases/${{ steps.envio.outputs.release }}
          PHP=php8.3
          cd \$R
          ln -sfn \$BASE/shared/.env .env
          rm -rf storage && ln -sfn \$BASE/shared/storage storage
          ln -sfn \$BASE/shared/storage/app/public public/storage
          ANTERIOR=\$(readlink -f \$BASE/current || true)

          # Arquivos do Vite da versão anterior continuam no ar por 2 dias: quem
          # estava com a página aberta pede o arquivo antigo e levava 404 (em
          # 18/10/2026 o admin no celular ficou sem estilo, ícones e menu).
          # A data do arquivo marca quando ele saiu do ar: os da versão que sai
          # agora (citados nos manifests dela) ganham a data de hoje, os que já
          # vieram de deploys anteriores mantêm a deles. Sem isso, depois de 2
          # dias sem deploy os arquivos da versão no ar eram descartados na hora.
          # Link físico, então a data vai junto e cada arquivo sai sozinho 2
          # dias depois de ter saído do ar.
          if [ -n "\$ANTERIOR" ] && [ -d "\$ANTERIOR/public/build/assets" ]; then
            {
              cat \$ANTERIOR/public/build/*manifest.json 2>/dev/null \
                | grep -oE '"assets/[^"]+"' | tr -d '"' | sort -u \
                | (cd \$ANTERIOR/public/build && xargs -r touch -c --)
              find \$ANTERIOR/public/build/assets -maxdepth 1 -type f -mmin -2880 \
                -exec cp -pln {} public/build/assets/ \;
            } || echo "aviso: não copiou os arquivos antigos do Vite"
          fi

          \$PHP artisan migrate --force
          \$PHP artisan optimize

          # Troca atômica do link: quem está navegando não vê erro.
          ln -sfn \$R \$BASE/current.novo && mv -Tf \$BASE/current.novo \$BASE/current
          sudo /usr/bin/systemctl reload php8.3-fpm
          # Workers sobem com o código novo (e saem de FATAL se estavam parados).
          sudo /usr/bin/supervisorctl restart 'kazakora:*'

          # A loja tem que responder; senão volta para a versão anterior.
          sleep 2
          if ! curl -fsS -o /dev/null -m 20 -H 'Host: kazakora.com' http://127.0.0.1/up; then
            echo "Loja não respondeu — voltando para a versão anterior"
            if [ -n "\$ANTERIOR" ] && [ -d "\$ANTERIOR" ]; then
              ln -sfn \$ANTERIOR \$BASE/current.novo && mv -Tf \$BASE/current.novo \$BASE/current
              sudo /usr/bin/systemctl reload php8.3-fpm
            fi
            exit 1
          fi

          # Guarda as 5 últimas versões para voltar rápido.
          # Limpeza das versões antigas não derruba o deploy: em 11/10/2026 um
          # arquivo criado como root dentro de uma versão antiga (prévia feita
          # direto no servidor) fez o deploy dar falha com a loja já no ar.
          ls -1dt \$BASE/releases/* | tail -n +6 | xargs -r rm -rf || echo "aviso: versão antiga com arquivo de outro dono — conferir no servidor"
          echo "No ar: ${{ steps.envio.outputs.release }}"
          SCRIPT
