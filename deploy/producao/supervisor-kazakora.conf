; Workers da fila da loja (Redis). "default": e-mails, WhatsApp, etiquetas;
; "nfe": notas fiscais (separada para nota nunca esperar atrás de e-mail).
[program:kazakora-default]
command=php8.3 /var/www/kazakora/current/artisan queue:work redis --queue=default --sleep=1 --tries=3 --timeout=110 --max-time=3600
user=deploy
numprocs=3
process_name=%(program_name)s_%(process_num)02d
autostart=true
autorestart=true
stopwaitsecs=120
stdout_logfile=/var/www/kazakora/shared/storage/logs/fila-default.log
stdout_logfile_maxbytes=10MB
redirect_stderr=true

[program:kazakora-nfe]
command=php8.3 /var/www/kazakora/current/artisan queue:work redis --queue=nfe --sleep=1 --tries=3 --timeout=300 --max-time=3600
user=deploy
numprocs=1
process_name=%(program_name)s_%(process_num)02d
autostart=true
autorestart=true
stopwaitsecs=320
stdout_logfile=/var/www/kazakora/shared/storage/logs/fila-nfe.log
stdout_logfile_maxbytes=10MB
redirect_stderr=true

[group:kazakora]
programs=kazakora-default,kazakora-nfe
