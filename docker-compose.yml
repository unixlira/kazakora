services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: kazakora_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    networks:
      - kazakora
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailhog:
        condition: service_started

  nginx:
    image: nginx:1.27-alpine
    container_name: kazakora_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - kazakora
    depends_on:
      - app

  mysql:
    image: mysql:8.0
    container_name: kazakora_mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: kazakora
      MYSQL_USER: kazakora
      MYSQL_PASSWORD: secret123
      MYSQL_ROOT_PASSWORD: secret123
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - kazakora
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "kazakora", "-psecret123"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: kazakora_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - kazakora
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: kazakora_mailhog
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"
    networks:
      - kazakora

  node:
    image: node:20-alpine
    container_name: kazakora_node
    working_dir: /var/www
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    volumes:
      - ./:/var/www
    ports:
      - "5173:5173"
    networks:
      - kazakora
    depends_on:
      - app

  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: kazakora_queue
    restart: unless-stopped
    working_dir: /var/www
    command: php artisan queue:work redis --sleep=3 --tries=3 --backoff=5
    volumes:
      - ./:/var/www
    networks:
      - kazakora
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailhog:
        condition: service_started

networks:
  kazakora:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
