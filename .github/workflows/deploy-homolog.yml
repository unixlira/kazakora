name: Deploy (homolog)

on:
  push:
    branches: [homolog]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2

      - name: Install PHP dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Deploy over SSH (rsync)
        uses: burnett01/rsync-deployments@7.0.2
        with:
          switches: -avzr --delete
            --exclude='.git'
            --exclude='.github'
            --exclude='.env'
            --exclude='/storage'
            --exclude='node_modules'
            --exclude='tests'
          path: ./
          remote_path: ${{ secrets.HOMOLOG_DEPLOY_PATH }}
          remote_host: ${{ secrets.HOMOLOG_SSH_HOST }}
          remote_port: ${{ secrets.HOMOLOG_SSH_PORT }}
          remote_user: ${{ secrets.HOMOLOG_SSH_USER }}
          remote_key: ${{ secrets.HOMOLOG_SSH_PRIVATE_KEY }}

      - name: Run post-deploy commands
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOMOLOG_SSH_HOST }}
          port: ${{ secrets.HOMOLOG_SSH_PORT }}
          username: ${{ secrets.HOMOLOG_SSH_USER }}
          key: ${{ secrets.HOMOLOG_SSH_PRIVATE_KEY }}
          script: |
            cd ${{ secrets.HOMOLOG_DEPLOY_PATH }}
            PHP=/opt/alt/php83/usr/bin/php
            $PHP artisan config:clear
            $PHP artisan migrate --force
            $PHP artisan config:cache
            $PHP artisan route:cache
            $PHP artisan view:cache
