# snippets/apps-vendas-site.conf: corpo dos sites app.kazakora.com e
# app.ferrakora.com (ver nginx-apps-vendas.conf). SPA estática: rota
# desconhecida cai no index.html. Página, scripts, manifest e service worker
# com no-cache (publicar vale na próxima abertura); ícones e telas de
# abertura por 1 dia.
index index.html;
charset utf-8;
include snippets/cloudflare-realip.conf;
server_tokens off;
types {
    text/html html;
    text/css css;
    text/javascript js;
    application/manifest+json webmanifest;
    image/png png;
    image/svg+xml svg;
    image/x-icon ico;
}
gzip on;
gzip_types text/css text/javascript application/manifest+json image/svg+xml;

location ~ ^/(icons|splash)/ {
    include snippets/apps-vendas-cabecalhos.conf;
    add_header Cache-Control "public, max-age=86400" always;
    try_files $uri =404;
}

location ~ /\. {
    deny all;
}

location / {
    include snippets/apps-vendas-cabecalhos.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri /index.html;
}
