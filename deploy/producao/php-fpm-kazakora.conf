; Pool kazakora (plano de pools KazaKora/FerraKora, 22/10/2026).
[kazakora]
user = deploy
group = www-data
listen = /run/php/kazakora.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660
pm = dynamic
pm.max_children = 24
pm.start_servers = 8
pm.min_spare_servers = 6
pm.max_spare_servers = 14
pm.max_requests = 1000
request_terminate_timeout = 120s
request_slowlog_timeout = 5s
slowlog = /var/log/php-fpm/kazakora-lento.log
pm.status_path = /status
php_admin_value[error_log] = /var/www/kazakora/shared/storage/logs/php-fpm.log
php_admin_flag[log_errors] = on
env[OPENSSL_CONF] = /etc/ssl/openssl-kazakora.cnf
