name: Deploy (produção)

# Push no main = loja kazakora.com na VPS (pedido 2026-10-10).
# Testa, compila no GitHub, envia para uma pasta nova (releases/...), roda as
# migrations e só então troca o link "current" — o site não sai do ar. Se a
# loja não responder depois da troca, volta sozinha para a versão anterior.
# Instalação da VPS e como voltar versão na mão: deploy/producao/LEIA-ME.md.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Mais rápido (pedido do Lira em 27/11/2026: "deploy não pode demorar tanto"):
# - a aprovação do ambiente producao fica num passo próprio que abre logo no
#   começo; dá para aprovar enquanto os testes rodam;
# - testes e compilação rodam ao mesmo tempo; o envio usa o que foi compilado;
# - push novo cancela a preparação (testes, compilação, aprovação parada) do
#   push anterior, que nunca chegou ao servidor; o envio em andamento NUNCA é
#   interrompido (grupo próprio, sem cancelar).
# A segurança não muda: só publica com a aprovação E todos os testes passando.

jobs:
  aprovacao:
    runs-on: ubuntu-latest
    environment: producao
    concurrency:
      group: deploy-producao-aprovacao
      cancel-in-progress: true
    steps:
      - run: echo "Aprovado para produção."

  compilar:
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-producao-compilar
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2

      - name: Cache do Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Dependências PHP (produção)
        run: composer install --no-dev --optimize-autoloader --classmap-authoritative --no-interaction --prefer-dist --no-progress

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Front
        run: npm ci && npm run build

      - name: Pacote da versão
        run: tar --exclude='./.git' --exclude='./node_modules' --exclude='./tests' -czf /tmp/versao.tgz .

      - uses: actions/upload-artifact@v4
        with:
          name: versao
          path: /tmp/versao.tgz
          retention-days: 3
          compression-level: 0

  testes:
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-producao-testes-${{ matrix.fatia }}
      cancel-in-progress: true
    # Em paralelo (pedido do Lira 25/11/2026): os testes são repartidos em 4
    # máquinas ao mesmo tempo (scripts/ci/fatia-testes.py), ~4x mais rápido.
    strategy:
      fail-fast: true
      matrix:
        fatia: [0, 1, 2, 3]
    name: testes (${{ matrix.fatia }})
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: gd, intl, bcmath, zip, soap, pdo_sqlite
          tools: composer:v2

      - name: Cache do Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Dependências
        run: composer install --no-interaction --prefer-dist --no-progress

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Front (os testes de página precisam do manifest do Vite)
        run: npm ci && npm run build

      - name: Testes
        run: |
          cp .env.example .env
          php artisan key:generate
          python3 scripts/ci/fatia-testes.py ${{ matrix.fatia }} 4
          php artisan test --compact

  deploy:
    needs: [aprovacao, compilar, testes]
    runs-on: ubuntu-latest
    # Um envio por vez e nunca interrompido no meio.
    concurrency:
      group: deploy-producao
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: versao
          path: /tmp

      - name: Abrir a versão compilada
        run: tar -xzf /tmp/versao.tgz -C . && rm /tmp/versao.tgz

      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.PROD_SSH_PRIVATE_KEY }}

      - name: Servidor conhecido
        run: |
          for i in 1 2 3; do ssh-keyscan -T 15 ${{ secrets.PROD_SSH_HOST }} >> ~/.ssh/known_hosts && break; sleep 5; done

      - name: Enviar nova versão
        id: envio
        run: |
          RELEASE=$(date -u +%Y%m%d%H%M%S)-${GITHUB_SHA::7}
          echo "release=$RELEASE" >> "$GITHUB_OUTPUT"
          BASE=/var/www/kazakora
          ssh deploy@${{ secrets.PROD_SSH_HOST }} "mkdir -p $BASE/releases/$RELEASE"
          # --link-dest: o que não mudou vira hard link da versão atual (envio rápido).
          # Até 3 tentativas com keepalive: 2x em 11/10/2026 a conexão caiu
          # no meio do envio (ssh 255) e o deploy só passou no rerun.
          for tentativa in 1 2 3; do
            rsync -az --delete \
              -e "ssh -o ServerAliveInterval=15 -o ServerAliveCountMax=8 -o ConnectTimeout=20" \
              --exclude='.git' --exclude='.github' --exclude='.env' --exclude='/storage' \
              --exclude='node_modules' --exclude='tests' --exclude='/public/storage' \
              --link-dest=$BASE/current/ \
              ./ deploy@${{ secrets.PROD_SSH_HOST }}:$BASE/releases/$RELEASE/ && break
            [ "$tentativa" = 3 ] && exit 1
            echo "rsync falhou (tentativa $tentativa/3), repetindo em 10s..."
            sleep 10
          done

      - name: Ativar
        run: |
          ssh deploy@${{ secrets.PROD_SSH_HOST }} 'bash -s' <<SCRIPT
          set -euo pipefail
          BASE=/var/www/kazakora
          R=\$BASE/releases/${{ steps.envio.outputs.release }}
          PHP=php8.3
          cd \$R
          ln -sfn \$BASE/shared/.env .env
          rm -rf storage && ln -sfn \$BASE/shared/storage storage
          ln -sfn \$BASE/shared/storage/app/public public/storage
          ANTERIOR=\$(readlink -f \$BASE/current || true)

          \$PHP artisan migrate --force
          \$PHP artisan optimize

          # Troca atômica do link: quem está navegando não vê erro.
          ln -sfn \$R \$BASE/current.novo && mv -Tf \$BASE/current.novo \$BASE/current
          sudo /usr/bin/systemctl reload php8.3-fpm
          # Workers sobem com o código novo (e saem de FATAL se estavam parados).
          sudo /usr/bin/supervisorctl restart 'kazakora:*'

          # A loja tem que responder; senão volta para a versão anterior.
          sleep 2
          if ! curl -fsS -o /dev/null -m 20 -H 'Host: kazakora.com' http://127.0.0.1/up; then
            echo "Loja não respondeu — voltando para a versão anterior"
            if [ -n "\$ANTERIOR" ] && [ -d "\$ANTERIOR" ]; then
              ln -sfn \$ANTERIOR \$BASE/current.novo && mv -Tf \$BASE/current.novo \$BASE/current
              sudo /usr/bin/systemctl reload php8.3-fpm
            fi
            exit 1
          fi

          # Abre as páginas de verdade (24/11/2026: o /up respondia 200 enquanto
          # toda página de produto dava 500 por uma regex que o PCRE daqui não
          # conhece). Qualquer 5xx ou falta de resposta volta para a anterior.
          # Pelo HTTPS local (--resolve): no http://127.0.0.1 o nginx só devolve 301.
          QUEBROU=""
          for CAMINHO in \$(\$PHP artisan loja:paginas-para-conferir); do
            CODIGO=\$(curl -s -o /dev/null -w '%{http_code}' -m 30 --resolve kazakora.com:443:127.0.0.1 "https://kazakora.com\$CAMINHO" || echo 000)
            echo "conferido \$CODIGO \$CAMINHO"
            if [ "\$CODIGO" = 000 ] || [ "\$CODIGO" -ge 500 ]; then QUEBROU="\$QUEBROU \$CAMINHO(\$CODIGO)"; fi
          done
          if [ -n "\$QUEBROU" ]; then
            echo "Páginas com erro:\$QUEBROU — voltando para a versão anterior"
            if [ -n "\$ANTERIOR" ] && [ -d "\$ANTERIOR" ]; then
              ln -sfn \$ANTERIOR \$BASE/current.novo && mv -Tf \$BASE/current.novo \$BASE/current
              sudo /usr/bin/systemctl reload php8.3-fpm
            fi
            exit 1
          fi

          # Guarda as 5 últimas versões para voltar rápido.
          # Limpeza das versões antigas não derruba o deploy: em 11/10/2026 um
          # arquivo criado como root dentro de uma versão antiga (prévia feita
          # direto no servidor) fez o deploy dar falha com a loja já no ar.
          ls -1dt \$BASE/releases/* | tail -n +6 | xargs -r rm -rf || echo "aviso: versão antiga com arquivo de outro dono — conferir no servidor"
          echo "No ar: ${{ steps.envio.outputs.release }}"
          SCRIPT
