; Drop-in do systemd: /etc/systemd/system/php8.3-fpm.service.d/openssl.conf
; Liga o provider "legacy" do OpenSSL no PHP da WEB, para ler o certificado
; A1 da NF-e (pfx com RC2/3DES), igual ao Horizon (supervisor-kazakora.conf).
;
; ACHADO REAL 2026-10-17 (#3205): o env[OPENSSL_CONF] do pool não basta. O
; OpenSSL lê a configuração uma vez, no processo mestre do FPM, antes de o
; pool aplicar o env[]. Resultado: cancelar NF-e pelo admin (botão "Cancelar
; pedido" e tela da nota) dava "Impossivel ler o certificado (unsupported)".
; Precisa estar no ambiente do mestre: systemctl daemon-reload e RESTART (o
; reload re-executa o mestre com o ambiente antigo).
[Service]
Environment=OPENSSL_CONF=/etc/ssl/openssl-kazakora.cnf
