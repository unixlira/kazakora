# Pools separados do PHP no kazakora.com (22/10/2026):
# /api/ferrakora/* -> ferrakora-api; demais /api/* (KoraSync, webhooks, agentes) -> integracoes;
# loja -> kazakora. Painel continua em php-painel.sock.
map $request_uri $kz_php_pool {
    ~^/api/ferrakora/  unix:/run/php/ferrakora-api.sock;
    ~^/api/            unix:/run/php/integracoes.sock;
    default            unix:/run/php/kazakora.sock;
}

# Limite por visitante (IP real via Cloudflare). Chave vazia = sem limite.
# Integracoes (KoraSync, webhooks) ficam sem limite no nginx.
map $request_uri $kz_lim_loja {
    ~^/api/  "";
    default  $binary_remote_addr;
}
map $request_uri $kz_lim_ferrakora {
    ~^/api/ferrakora/  $binary_remote_addr;
    default            "";
}
limit_req_zone $kz_lim_loja      zone=kz_loja:10m      rate=10r/s;
limit_req_zone $kz_lim_ferrakora zone=kz_ferrakora:10m rate=10r/s;
limit_req_status 429;

# Status de cada pool, só de dentro do servidor:
# curl -s 127.0.0.1:8090/status/kazakora (ou painel, ferrakora-api, integracoes)
server {
    listen 127.0.0.1:8090;
    access_log off;
    location ~ ^/status/(kazakora|ferrakora-api|integracoes|php-painel)$ {
        fastcgi_pass unix:/run/php/$1.sock;
        fastcgi_param REQUEST_METHOD GET;
        fastcgi_param SCRIPT_NAME /status;
        fastcgi_param SCRIPT_FILENAME /status;
        fastcgi_param QUERY_STRING $query_string;
    }
}
