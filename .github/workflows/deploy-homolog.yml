name: Deploy (homolog)

on:
  push:
    branches: [homolog]

# Um deploy por vez: em 16/10 dois merges com segundos de diferença
# rodaram o rsync juntos e o commit mais antigo sobrescreveu o mais novo.
# Sem cancel-in-progress: o deploy em andamento termina e o próximo espera.
concurrency:
  group: deploy-homolog
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2

      - name: Install PHP dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Set up SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.HOMOLOG_SSH_PRIVATE_KEY }}

      - name: Add server to known_hosts
        run: ssh-keyscan -p ${{ secrets.HOMOLOG_SSH_PORT }} ${{ secrets.HOMOLOG_SSH_HOST }} >> ~/.ssh/known_hosts

      # Arquivos do Vite da versão que sai ficam 2 dias (mesma regra da
      # produção): a data marca quando saíram do ar, o rsync não apaga
      # public/build/assets e a limpeza depois tira só os de mais de 2 dias.
      - name: Mark outgoing Vite assets
        run: |
          ssh -p ${{ secrets.HOMOLOG_SSH_PORT }} ${{ secrets.HOMOLOG_SSH_USER }}@${{ secrets.HOMOLOG_SSH_HOST }} '
            cd ${{ secrets.HOMOLOG_DEPLOY_PATH }}/public/build 2>/dev/null || exit 0
            cat *manifest.json 2>/dev/null | grep -oE "\"assets/[^\"]+\"" | tr -d "\"" | sort -u | xargs -r touch -c --
          ' || echo "aviso: não marcou os arquivos antigos do Vite"

      - name: Deploy via rsync
        run: |
          rsync -avz --delete \
            --filter='P /public/build/assets/**' \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.env' \
            --exclude='/storage' \
            --exclude='node_modules' \
            --exclude='tests' \
            -e "ssh -p ${{ secrets.HOMOLOG_SSH_PORT }}" \
            ./ ${{ secrets.HOMOLOG_SSH_USER }}@${{ secrets.HOMOLOG_SSH_HOST }}:${{ secrets.HOMOLOG_DEPLOY_PATH }}/

      - name: Run post-deploy commands
        run: |
          ssh -p ${{ secrets.HOMOLOG_SSH_PORT }} ${{ secrets.HOMOLOG_SSH_USER }}@${{ secrets.HOMOLOG_SSH_HOST }} '
            cd ${{ secrets.HOMOLOG_DEPLOY_PATH }}
            PHP=/opt/alt/php83/usr/bin/php
            # optimize:clear no lugar de config:clear: o rsync --delete
            # acabou de trocar os arquivos, então qualquer cache compilado
            # que tenha sobrado (config, rotas, views, eventos) está velho.
            $PHP artisan optimize:clear
            $PHP artisan migrate --force
            $PHP artisan storage:link || true
            # Idempotente: só olha foto com thumb_path nulo. Depois do
            # primeiro deploy que gera as miniaturas, vira uma consulta
            # vazia. || true porque miniatura faltando não derruba o site
            # (thumb_url cai pra imagem original sozinho).
            $PHP artisan catalog:generate-thumbnails || true
            # Foto média da página de produto (2026-10-15), mesma lógica.
            $PHP artisan catalog:generate-medium-images || true
            $PHP artisan config:cache
            $PHP artisan route:cache
            $PHP artisan view:cache
            find public/build/assets -maxdepth 1 -type f -mmin +2880 -delete || true
          '
